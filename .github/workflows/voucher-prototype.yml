name: Build voucher prototype
on:
  pull_request:
    paths:
      - 'Prototype/**'
      - '.github/workflows/voucher-prototype.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test voucher entry on iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for ds in reversed(list(json.load(sys.stdin)["devices"].values())) for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project Prototype/KaKeBoPrototype.xcodeproj -scheme KaKeBoPrototype \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Voucher.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Export screen captures
        if: always()
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Voucher.xcresult" --output-path "$RUNNER_TEMP/voucher-screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voucher-iphone-screens
          path: ${{ runner.temp }}/voucher-screens
